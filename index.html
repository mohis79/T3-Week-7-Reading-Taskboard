 had appeared on the library wall."],questions:[{q:"1. Why did Anahera remain in the library?",options:["A. To meet Wiremu","B. To return a book","C. To draw a map","D. To hide from a teacher"]},{q:"2. Which event happened just before the wall opened?",options:["A. Wiremu read the note","B. A bird landed","C. Anahera pressed the carved leaf","D. The map disappeared"]},{q:"3. The word shimmered suggests the ink\u2026",options:["A. gave off a soft, changing light","B. had completely dried","C. was difficult to read","D. was running off the page"]},{q:"4. Why did Wiremu want to leave?",options:["A. He could not see the promised tree","B. He had lost the map","C. He disliked libraries","D. He heard the birds"]},{q:"5. What was unusual about the birds?",options:["A. They were silver","B. They carried forgotten stories","C. They could open walls","D. They lived at school"]},{q:"6. What does Anahera\u2019s behaviour show?",options:["A. She is careless","B. She is observant and determined","C. She is impatient","D. She is frightened of mysteries"]},{q:"7. What is the main idea of the story?",options:["A. Old buildings should be repaired","B. Careful noticing can uncover stories worth sharing","C. Maps are more useful than books","D. Friends should never stay late"]},{q:"8. Which detail best proves the adventure was real?",options:["A. The library was quiet","B. Wiremu wanted to leave","C. A new silver leaf appeared","D. The paper was yellow"]}]},3:{title:"The Clockmaker\u2019s Last Minute",level:"PAT focus: inference, cause and effect, author\u2019s purpose",image:"data:image/webp;base64,UklGRqgVAQBXRUJQVlA4IJwVAQAwgQSdASqEA1gCPpFAmkolo6WmptQ7qNASCWNsHCSOjt2suexXEu1CHEMXX2qHl1JYLehSvmVtRjX1vVcq0kv5v99BLmX1D/h6P+Fz0Lmd+4d+r07/4f1H/8T6SvUN5of3P9YD05/4H7ZvkO/1Xpb+s//bPVw86n1qP8r/8OoA///to86/5n5K/oPYT+gekx7P+CO1z8FZ6f9Pw1/cf7n0FPgG/J8T5i/wP+Z83D9/zw/ePUD8xf/h5Cf5D/yewV/S/9v6xv/V5hP2//rewr/XP9b1xf3v////0+H/94zVsczhAdI0rVO1kK6vH0MDhI/cPBZBLLPVZYOD58JmbEehY80/3E9+XVPWnmHnRJ6YzLPaB f gold","B. It is the only clock still ticking","C. It predicts the storm","D. It belongs to the mayor"]},{q:"2. Why does Maia use the emergency minute?",options:["A. To find her grandfather","B. To repair every clock","C. To help people escape the flood","D. To make morning arrive"]},{q:"3. In the phrase \u2018twisting like smoke\u2019, the author uses\u2026",options:["A. a simile","B. a command","C. repetition","D. a fact"]},{q:"4. What caused the pocket watch to stop forever?",options:["A. Maia dropped it","B. The borrowed minute required a price","C. Rain entered the workshop","D. Her grandfather returned"]},{q:"5. Grandfather\u2019s warning mainly means\u2026",options:["A. clocks should be repaired quickly","B. time must be used responsibly","C. roads are dangerous in storms","D. promises should be written down"]},{q:"6. How does Maia change?",options:["A. She moves from confusion to understanding","B. She becomes less willing to help","C. She forgets her grandfather","D. She decides magic is useless"]},{q:"7. Why is the final message included?",options:["A. To explain the storm","B. To reveal the story\u2019s message about sacrifice","C. To introduce a new character","D. To prove Maia built the machine"]},{q:"8. Which theme is best supported?",options:["A. Valuable choices can require sacrifice","B. Machines always cause trouble","C. Adults understand everything","D. Time passes slowly during storms"]}]},4:{title:"The City That Traded Shadows",level:"PAT focus: close reading, symbolism, viewpoint and theme",image:"data:image/webp;base64,UklGRjglAQBXRUJQVlA4ICwlAQBQlgSdASqEA1gCPpFAmkolo6IrqDVrIXASCWVsYgdlAu0oRPOG5uJQNnypk8XNPN1+14eTTyn8z30vJ9HlaAF1Er36+1ffYnXS68PmXxmurM2P3L/a89Ppt/vXo2dJHzUecF6h/796TPpfesv/hPVO/bH1qPWf/zu/689v5x5LvnvXz+e/dP9P1l/4rLf8D/q+av3xzv/6Hg7+xf1/oI+8/Qk/T7rTg/+h6C/vr+S84T9Tzr/dP9/7APmN/7vGA/Lf+L2Bf6x/uPWG/5vLT+1fmh8CP7Tf/j/adsX99f//7wy8QBb98v9p6vx7B9PuO6S8XZnCETWJd/4ICXFTIKm14LAOBwtVYDJu9s4JilkrrUjl3hS7yy769xlKfl0c+OlxLBmUkzJvHU1a2Rue8fL  afterwards she laughed less easily and could no longer remember her dreams. Riko suspected shadows carried more than darkness.","Before the city scholarship trial, Riko\u2019s rival offered him a silver token. One visit to the Shadow Market, she said, and he could gain the perfect memory needed to win. Riko wanted the scholarship because it would allow him to study beyond Umbra\u2019s walls. He took the token but told himself he was only curious.","At the market, glass jars lined the shelves. Inside them, shadows pressed their hands against the glass. The merchant promised Riko a flawless memory in exchange for \u2018one unnecessary piece of darkness.\u2019 As Riko reached for the contract, his shadow pulled away from his feet and pointed towards a locked back room.","Riko followed it. There he found thousands of bottled memories: first steps, family songs, secret hopes and acts of courage. The merchants were not merely buying shadows. They were removing the parts of people that might make them question the city\u2019s rules.","Riko used the silver token to unlock the shelves. Shadows poured through the market and raced back to their owners. Across Umbra, people paused as lost memories returned. Riko\u2019s mother remembered a lullaby and began to sing.","The market guards arrived before Riko could escape. At the scholarship trial the next day, he was tired and unprepared. Instead of answering the official questions, he told the judges what the market had done. For a long moment, nobody spoke. Then one judge stood and placed her own shadowless hand on the table.","Riko did not win the scholarship that day. He received something riskier: an invitation to help investigate the market. Beyond the hall, the city\u2019s returning shadows stretched towards sunrise, longer and clearer than before."],questions:[{q:"1. Why does Riko distrust shadow trading?",options:["A. Shadows are expensive","B. His mother changed after her trade","C. He dislikes the market building","D. His rival warns him"]},{q:"2. What is Riko\u2019s main internal conflict?",options:["A. Whether to leave his mother","B. Whether to gain an unfair advantage to achieve his goal","C. Whether to become a merchant","D. Whether to enter the trial late"]},{q:"3. \u2018He was only curious\u2019 suggests Riko is\u2026",options:["A. honestly uninterested","B. justifying a choice he knows is risky","C. certain he will refuse","D. planning to help the guards"]},{q:"4. What do the bottled memories reveal?",options:["A. The market controls people by removing parts of their identity","B. The jars improve memory","C. The merchants protect family stories","D. The scholarship judges own the market"]},{q:"5. Why does the judge show her shadowless hand?",options:["A. She wants the silver token","B. She may understand or share the harm Riko describes","C. She is ending the trial","D. She does not believe Riko"]},{q:"6. The returning shadows stretching towards sunrise most likely symbolise\u2026",options:["A. danger returning to Umbra","B. truth, hope and identity being restored","C. the market becoming stronger","D. Riko leaving the city"]},{q:"7. Which statement best describes Riko?",options:["A. He values success above fairness","B. He is brave enough to risk his goal for others","C. He avoids difficult decisions","D. He depends on magic to solve problems"]},{q:"8. What is the author\u2019s main purpose?",options:["A. To explain how shadows form","B. To entertain while exploring identity and ethical choices","C. To persuade readers to enter competitions","D. To describe a real marketplace"]},{q:"9. Which theme is most strongly developed?",options:["A. Achievement is meaningless without integrity","B. Memories prevent people from succeeding","C. Rules should never be questioned","D. Rivals cannot become friends"]},{q:"10. Why is the ending described as \u2018riskier\u2019?",options:["A. Investigation may bring danger, but it can create real change","B. Riko must repeat the trial","C.
